- name: install cev-sync
  ansible.builtin.copy:
    src: cev-sync
    dest: /usr/local/sbin/cev-sync
    mode: "0755"

- name: install cev-sync.service
  ansible.builtin.copy:
    src: cev-sync.service
    dest: /etc/systemd/system/cev-sync.service
    mode: "0644"
  notify: reload systemd

- name: install cev-sync.timer
  ansible.builtin.template:
    src: cev-sync.timer.j2
    dest: /etc/systemd/system/cev-sync.timer
    mode: "0644"
  notify: reload systemd

- name: apply unit changes before enabling
  ansible.builtin.meta: flush_handlers

- name: enable cev-sync.timer
  ansible.builtin.systemd_service:
    name: cev-sync.timer
    enabled: true
    state: started
